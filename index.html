<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Pulse</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef7f1;
      color: #173b2a;
      font-family: system-ui, sans-serif;
    }

    main {
      margin: 1rem;
      padding: 2.5rem;
      border-radius: 1.25rem;
      background: white;
      box-shadow: 0 8px 32px rgb(23 59 42 / 12%);
      text-align: center;
    }

    .robot {
      font-size: 4rem;
    }

    .speech {
      padding: 0.75rem 1.25rem;
      border-radius: 1rem;
      background: #dcfce7;
    }
  </style>
</head>
<body>
  <main>
    <div class="robot" aria-hidden="true">🤖</div>
    <h1>Pipeline Pulse</h1>
    <p class="speech">Hoi! De website is online.</p>
  </main>
</body>
</html>
